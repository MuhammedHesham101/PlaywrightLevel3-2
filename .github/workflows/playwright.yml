name: Level3-2
on:
  workflow_dispatch:
  pull_request:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run SmokeLogin tests
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL }}
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
        PLAYWRIGHT_HTML_OUTPUT_DIR: reports/smoke-login
      run: npx playwright test tests/shop.spec.ts --project=chromium --grep @SmokeLogin --output=test-results/smoke-login

    - name: Run SmokeDashboard tests
      if: ${{ !cancelled() }}
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL }}
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
        PLAYWRIGHT_HTML_OUTPUT_DIR: reports/smoke-dashboard
      run: npx playwright test tests/shop.spec.ts --project=chromium --grep @SmokeDashboard --output=test-results/smoke-dashboard

    - name: Run regression tests
      if: ${{ !cancelled() }}
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL }}
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
        PLAYWRIGHT_HTML_OUTPUT_DIR: reports/regression
      run: npx playwright test tests/shop.spec.ts --project=chromium --grep @regression --output=test-results/regression

    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: reports/
        retention-days: 30

    - name: Upload screenshots
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: test-results/
        retention-days: 30
