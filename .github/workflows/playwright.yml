name: Level3-2
on: [workflow_dispatch]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run SmokeLogin tests
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL }}
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: npx playwright test tests/shop.spec.ts --project=chromium --grep @SmokeLogin --screenshot=on

    - name: Run SmokeDashboard tests
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL }}
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: npx playwright test tests/shop.spec.ts --project=chromium --grep @SmokeDashboard --screenshot=on

    - name: Run regression tests
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL }}
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: npx playwright test tests/shop.spec.ts --project=chromium --grep @regression --screenshot=on

    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: reports/
        retention-days: 30

    - name: Upload screenshots
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: test-results/
        retention-days: 30
